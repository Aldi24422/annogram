name: annogram
description: A third-party Telegram client built with Flutter

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  stream_transform: ^2.0.0
  ffi: ^2.1.0
  path_provider: ^2.1.5
  package_info_plus: ^8.0.0
  shared_preferences: ^2.5.4
  google_fonts: ^6.3.3
  image_picker: ^1.2.1
  record: ^6.1.2
  audioplayers: ^6.5.1
  permission_handler: ^12.0.1
  file_picker: ^10.3.8
  open_filex: ^4.7.0
  video_player: ^2.10.1
  emoji_picker_flutter: ^4.4.0
  flutter_contacts: ^1.1.9+2
  flutter_local_notifications: ^19.5.0
  lottie: ^3.1.0      
  chewie: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/